services:
  - type: web
    name: sviber-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    branch: chat-page

  - type: static
    name: sviber-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: chat-page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

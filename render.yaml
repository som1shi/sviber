services:
  - type: web
    name: sviber-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    branch: main

  - type: static
    name: sviber-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://sviber-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
